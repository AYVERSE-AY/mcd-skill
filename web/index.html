<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门神谕 · 每日麦门决策助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1c2e;
  --card-bg: #f5e9cc;
  --gold: #c9a227;
  --gold-dark: #8a6e1e;
  --wine: #7b1f3a;
  --ink: #2a2132;
  --parchment: #f9efd6;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 30% 20%, #252844 0%, #151727 60%, #0d0f1c 100%);
  color: var(--parchment);
  font-family: "Noto Serif SC", "Songti SC", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 40px;
}

header {
  text-align: center;
  margin-bottom: 24px;
}

header h1 {
  font-family: "Cinzel", "Times New Roman", serif;
  font-size: 2.2rem;
  margin: 0 0 6px;
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 0 2px 12px rgba(201,162,39,.35);
}

header p {
  margin: 0;
  opacity: .85;
  font-size: .95rem;
}

#status {
  display: inline-block;
  margin-top: 10px;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: .8rem;
  background: rgba(201,162,39,.15);
  border: 1px solid rgba(201,162,39,.35);
  color: var(--gold);
}
#status.fallback {
  background: rgba(180,180,180,.12);
  border-color: rgba(180,180,180,.3);
  color: #aaa;
}

main {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 32px;
  width: 100%;
  max-width: 1120px;
  align-items: start;
}

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
}

.panel {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(201,162,39,.2);
  border-radius: 16px;
  padding: 24px;
  backdrop-filter: blur(6px);
}

.panel h2 {
  font-family: "Cinzel", serif;
  font-size: 1.15rem;
  color: var(--gold);
  margin: 0 0 18px;
  letter-spacing: 2px;
}

.question {
  margin-bottom: 20px;
}

.question label {
  display: block;
  font-size: .92rem;
  margin-bottom: 10px;
  opacity: .9;
}

.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.options button {
  padding: 8px 14px;
  border: 1px solid rgba(201,162,39,.35);
  border-radius: 20px;
  background: rgba(0,0,0,.2);
  color: var(--parchment);
  font-family: inherit;
  font-size: .86rem;
  cursor: pointer;
  transition: all .2s;
}

.options button:hover, .options button.selected {
  background: rgba(201,162,39,.25);
  border-color: var(--gold);
  color: var(--gold);
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}

.actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-family: "Noto Serif SC", serif;
  font-size: 1rem;
  cursor: pointer;
  transition: transform .15s, box-shadow .2s;
}

.actions button.primary {
  background: linear-gradient(135deg, #c9a227 0%, #8a6e1e 100%);
  color: #151727;
  font-weight: 700;
}

.actions button.secondary {
  background: rgba(255,255,255,.1);
  color: var(--parchment);
  border: 1px solid rgba(255,255,255,.2);
}

.actions button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.actions button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.recommendation {
  display: none;
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(201,162,39,.12);
  border: 1px solid rgba(201,162,39,.25);
}

.recommendation.show { display: block; }

.recommendation h3 {
  margin: 0 0 8px;
  font-family: "Cinzel", serif;
  color: var(--gold);
  font-size: 1rem;
}

.recommendation p {
  margin: 0;
  font-size: .88rem;
  line-height: 1.6;
  opacity: .9;
}

.style-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
}

.style-chip {
  padding: 7px 12px;
  border: 1px solid rgba(201,162,39,.35);
  border-radius: 18px;
  background: rgba(0,0,0,.2);
  color: var(--parchment);
  font-family: inherit;
  font-size: .8rem;
  cursor: pointer;
  transition: all .2s;
}

.style-chip .num {
  display: inline-block;
  margin-right: 5px;
  color: var(--gold);
  font-family: "Cinzel", serif;
  font-weight: 700;
}

.style-chip:hover, .style-chip.active {
  background: rgba(201,162,39,.25);
  border-color: var(--gold);
}

.card-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#card {
  width: 360px;
  height: 630px;
  background: var(--card-bg);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 40px rgba(123,31,58,.08);
  position: relative;
  overflow: hidden;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px;
}

.card-border {
  position: absolute;
  inset: 12px;
  border: 3px solid var(--gold);
  border-radius: 14px;
  pointer-events: none;
}

.card-border::after {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid var(--gold-dark);
  border-radius: 10px;
}

.corner {
  position: absolute;
  width: 46px;
  height: 46px;
  color: var(--wine);
  pointer-events: none;
}

.corner.tl { top: 18px; left: 18px; }
.corner.tr { top: 18px; right: 18px; transform: rotate(90deg); }
.corner.br { bottom: 18px; right: 18px; transform: rotate(180deg); }
.corner.bl { bottom: 18px; left: 18px; transform: rotate(270deg); }

.roman {
  font-family: "Cinzel", serif;
  font-size: 2.4rem;
  color: var(--wine);
  margin-top: 26px;
  z-index: 1;
}

.style-name {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--ink);
  margin-top: 4px;
  z-index: 1;
}

.style-en {
  font-family: "Cinzel", serif;
  font-size: .72rem;
  color: var(--gold-dark);
  letter-spacing: 2px;
  margin-top: 3px;
  z-index: 1;
}

.symbol-frame {
  width: 220px;
  height: 220px;
  margin-top: 18px;
  border: 2px solid var(--gold-dark);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  overflow: hidden;
  background: rgba(201,162,39,.06);
}

.symbol-frame::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px dashed rgba(138,110,30,.5);
  border-radius: 50%;
  z-index: 1;
  pointer-events: none;
}

.symbol-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.card-text {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  z-index: 1;
  text-align: center;
}

.card-text p {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.75;
  color: var(--ink);
}

.quote-open, .quote-close {
  font-family: "Cinzel", serif;
  font-size: 2rem;
  color: var(--gold-dark);
  line-height: 1;
}

.plaque {
  width: 86%;
  padding: 10px 16px;
  border: 2px solid var(--gold-dark);
  border-radius: 8px;
  text-align: center;
  background: rgba(201,162,39,.1);
  z-index: 1;
}

.plaque-en {
  font-family: "Cinzel", serif;
  font-size: .7rem;
  letter-spacing: 1.5px;
  color: var(--wine);
}

.plaque-cn {
  font-size: .8rem;
  color: var(--gold-dark);
  letter-spacing: 3px;
  margin-top: 2px;
}

.source {
  font-size: .65rem;
  color: var(--gold-dark);
  margin-top: 10px;
  z-index: 1;
}

.card-actions {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

.card-actions button {
  padding: 10px 18px;
  border-radius: 8px;
  border: 1px solid rgba(201,162,39,.4);
  background: rgba(0,0,0,.3);
  color: var(--parchment);
  font-family: inherit;
  font-size: .9rem;
  cursor: pointer;
}

.card-actions button:hover { background: rgba(201,162,39,.2); }

#toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,.8);
  color: var(--parchment);
  padding: 10px 20px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: all .3s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 问卷浮层 */
.quiz-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(13,15,28,.32);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s ease;
}
.quiz-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.quiz-modal {
  width: min(520px, 90vw);
  padding: 36px 36px 30px;
  border-radius: 28px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 32px 90px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
  transform: translateY(30px) scale(.94);
  transition: transform .65s cubic-bezier(.16,1,.3,1), opacity .55s ease;
  opacity: 0;
  overflow: hidden;
}
.quiz-overlay.show .quiz-modal {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.quiz-modal h2 {
  font-family: "Cinzel", serif;
  font-size: 1.45rem;
  color: var(--gold);
  margin: 0 0 6px;
  text-align: center;
  letter-spacing: 3px;
}

.quiz-modal .quiz-sub {
  text-align: center;
  font-size: .88rem;
  opacity: .65;
  margin-bottom: 22px;
}

.quiz-progress {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
}

.quiz-progress .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  transition: all .35s ease;
}
.quiz-progress .dot.active {
  width: 28px;
  border-radius: 4px;
  background: var(--gold);
}

.quiz-slides {
  position: relative;
  min-height: 240px;
}

.quiz-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: translateX(40px);
  pointer-events: none;
  transition: opacity .45s ease, transform .5s cubic-bezier(.16,1,.3,1);
}
.quiz-slide.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
  position: relative;
}
.quiz-slide.prev {
  transform: translateX(-40px);
}

.quiz-modal .question {
  margin: 0;
  padding: 0;
  border: none;
}

.quiz-modal .question label {
  display: block;
  font-size: 1.05rem;
  margin-bottom: 18px;
  color: var(--parchment);
  text-align: center;
  letter-spacing: 1px;
}

.quiz-modal .options {
  justify-content: center;
}

.quiz-modal .options button {
  background: rgba(255,255,255,.05);
  border-color: rgba(255,255,255,.14);
  padding: 10px 18px;
  font-size: .9rem;
}
.quiz-modal .options button:hover, .quiz-modal .options button.selected {
  background: rgba(201,162,39,.18);
  border-color: var(--gold);
  color: var(--gold);
  transform: translateY(-1px);
}

.quiz-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  gap: 12px;
}

.quiz-nav button {
  padding: 10px 22px;
  border-radius: 8px;
  font-family: "Noto Serif SC", serif;
  font-size: .95rem;
  cursor: pointer;
  transition: all .2s;
  border: none;
}

.quiz-nav .next {
  background: linear-gradient(135deg, #c9a227 0%, #8a6e1e 100%);
  color: #151727;
  font-weight: 700;
}
.quiz-nav .next:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(201,162,39,.25); }
.quiz-nav .next:disabled { opacity: .35; cursor: not-allowed; }

.quiz-nav .back {
  background: transparent;
  color: var(--parchment);
  border: 1px solid rgba(255,255,255,.2);
}
.quiz-nav .back:hover { background: rgba(255,255,255,.08); }

.quiz-nav .skip {
  background: transparent;
  color: var(--parchment);
  font-size: .82rem;
  opacity: .55;
}
.quiz-nav .skip:hover { opacity: .9; text-decoration: underline; }

.recommend-toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  z-index: 90;
  padding: 14px 24px;
  border-radius: 30px;
  background: rgba(26,28,46,.92);
  border: 1px solid rgba(201,162,39,.35);
  box-shadow: 0 10px 40px rgba(0,0,0,.35);
  color: var(--parchment);
  font-size: .92rem;
  opacity: 0;
  pointer-events: none;
  transition: all .4s cubic-bezier(.2,.8,.2,1);
  text-align: center;
  max-width: min(560px, 92vw);
}
.recommend-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.recommend-toast strong {
  color: var(--gold);
}

.panel .section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel .section-title button {
  font-size: .75rem;
  padding: 4px 10px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid rgba(201,162,39,.35);
  color: var(--gold);
  cursor: pointer;
}
</style>
</head>
<body>

<!-- 问卷浮层 -->
<div class="quiz-overlay show" id="quiz-overlay">
  <div class="quiz-modal">
    <h2>今日麦门神谕</h2>
    <p class="quiz-sub">回答 4 个小问题，为你推荐一张生活签</p>

    <div class="quiz-progress" id="quiz-progress">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="quiz-slides" id="quiz-slides">
      <div class="quiz-slide active" data-idx="0">
        <div class="question" data-q="time">
          <label>现在是什么时间？</label>
          <div class="options">
            <button data-v="morning">早上（7-11点）</button>
            <button data-v="noon">中午（11-14点）</button>
            <button data-v="afternoon">下午（14-17点）</button>
            <button data-v="evening">晚上（17-21点）</button>
            <button data-v="night">深夜（21点后）</button>
          </div>
        </div>
      </div>

      <div class="quiz-slide" data-idx="1">
        <div class="question" data-q="mood">
          <label>你现在的状态？</label>
          <div class="options">
            <button data-v="tired">困倦没精神</button>
            <button data-v="confused">纠结吃啥</button>
            <button data-v="stressed">压力大</button>
            <button data-v="relaxed">想放松</button>
            <button data-v="happy">开心想分享</button>
            <button data-v="disciplined">自律/健身中</button>
            <button data-v="lazy">想摸鱼</button>
          </div>
        </div>
      </div>

      <div class="quiz-slide" data-idx="2">
        <div class="question" data-q="scene">
          <label>你在什么场景？</label>
          <div class="options">
            <button data-v="commute">通勤/路上</button>
            <button data-v="office">办公室</button>
            <button data-v="home">家里</button>
            <button data-v="party">聚会</button>
            <button data-v="gym">健身</button>
            <button data-v="outdoor">户外</button>
          </div>
        </div>
      </div>

      <div class="quiz-slide" data-idx="3">
        <div class="question" data-q="health">
          <label>想要健康低卡一点吗？</label>
          <div class="options">
            <button data-v="yes">是的，要低卡</button>
            <button data-v="no">不用，开心吃</button>
          </div>
        </div>
      </div>
    </div>

    <div class="quiz-nav">
      <button class="back" id="btn-quiz-back" style="visibility:hidden;">上一题</button>
      <button class="skip" id="btn-skip-quiz">跳过问卷</button>
      <button class="next" id="btn-quiz-next" disabled>下一题</button>
    </div>
  </div>
</div>

<div class="recommend-toast" id="recommend-toast"></div>

<header>
  <h1>麦 门 神 谕</h1>
  <p>每日麦门决策助手 · 抽一张生活签，决定今天吃什么</p>
  <span id="status">连接中…</span>
</header>

<main>
  <section class="panel">
    <div class="section-title">
      <h2 style="margin:0">推荐结果</h2>
      <button id="btn-retake">重新测评</button>
    </div>
    <p id="rec-summary" style="margin-top:12px;font-size:.9rem;opacity:.85;">完成左侧问卷后，会为你推荐最适合今日的生活签。</p>

    <h2 style="margin-top:22px;">或直接选择</h2>
    <div class="style-row" id="styles"></div>
  </section>

  <section class="card-stage">
    <div id="card">
      <div class="card-border"></div>
      <svg class="corner tl" viewBox="0 0 46 46"><path d="M4 42V10C4 6 6 4 10 4H42" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3" fill="currentColor"/></svg>
      <svg class="corner tr" viewBox="0 0 46 46"><path d="M4 42V10C4 6 6 4 10 4H42" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3" fill="currentColor"/></svg>
      <svg class="corner br" viewBox="0 0 46 46"><path d="M4 42V10C4 6 6 4 10 4H42" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3" fill="currentColor"/></svg>
      <svg class="corner bl" viewBox="0 0 46 46"><path d="M4 42V10C4 6 6 4 10 4H42" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3" fill="currentColor"/></svg>

      <div class="roman" id="c-roman">I</div>
      <div class="style-name" id="c-title">早八续命签</div>
      <div class="style-en" id="c-subtitle">THE MORNING AWAKENING</div>

      <div class="symbol-frame">
        <img id="c-image" src="" alt="神谕卡面">
      </div>

      <div class="card-text">
        <span class="quote-open">“</span>
        <p id="c-text">点击下方按钮，抽取今日麦门神谕…</p>
        <span class="quote-close">”</span>
      </div>

      <div class="plaque">
        <div class="plaque-en" id="c-plaque-en">THE MCMEN ORACLE</div>
        <div class="plaque-cn" id="c-plaque-cn">麦 门 神 谕</div>
      </div>

      <div class="source" id="c-source">数据源：等待连接…</div>
    </div>

    <div class="card-actions">
      <button id="btn-gen">✨ 生成神谕</button>
      <button id="btn-download">⬇ 下载图片</button>
      <button id="btn-copy">📋 复制文字</button>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
const STYLES = {
  morning: { name: "早八续命签", en: "THE MORNING AWAKENING", plaque: "晨 起 神 谕", roman: "I", visual: "modern", image: "assets/cards/card-1.png" },
  lunch:   { name: "中午干饭签", en: "THE LUNCH DECREE",      plaque: "干 饭 神 谕", roman: "II", visual: "fantasy", image: "assets/cards/card-2.png" },
  afternoon:{ name: "下午茶摸鱼签", en: "THE AFTERNOON SNEAK", plaque: "摸 鱼 神 谕", roman: "III", visual: "classic", image: "assets/cards/card-3.png" },
  overtime:{ name: "加班回血签", en: "THE NIGHT SHIFT CURE",  plaque: "回 血 神 谕", roman: "IV", visual: "modern", image: "assets/cards/card-4.png" },
  feast:   { name: "周末欢聚签", en: "THE WEEKEND FEAST",     plaque: "欢 聚 神 谕", roman: "V", visual: "fantasy", image: "assets/cards/card-5.png" },
  light:   { name: "自律轻食签", en: "THE LIGHT CHOICE",      plaque: "轻 食 神 谕", roman: "VI", visual: "classic", image: "assets/cards/card-6.png" }
};

let currentStyle = "morning";
let currentCard = null;
let answers = {};
let currentSlide = 0;
const TOTAL_SLIDES = 4;

const $ = (id) => document.getElementById(id);
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

async function fetchJSON(url, opts = {}, timeout = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function getCurrentQuestionKey() {
  const slide = document.querySelector(`.quiz-slide[data-idx="${currentSlide}"]`);
  return slide?.querySelector(".question")?.dataset.q;
}

function updateNextButton() {
  const key = getCurrentQuestionKey();
  const next = $("btn-quiz-next");
  const hasAnswer = key && answers[key];
  next.disabled = !hasAnswer;
  next.textContent = currentSlide === TOTAL_SLIDES - 1 ? "获取推荐" : "下一题";
}

function updateSlide(dir = 1) {
  const slides = document.querySelectorAll(".quiz-slide");
  const dots = document.querySelectorAll(".quiz-progress .dot");

  slides.forEach((s, i) => {
    s.classList.remove("active", "prev");
    if (i < currentSlide) s.classList.add("prev");
    if (i === currentSlide) s.classList.add("active");
  });

  dots.forEach((d, i) => d.classList.toggle("active", i === currentSlide));

  $("btn-quiz-back").style.visibility = currentSlide === 0 ? "hidden" : "visible";
  updateNextButton();
}

function goNext() {
  const key = getCurrentQuestionKey();
  if (!key || !answers[key]) return;
  if (currentSlide < TOTAL_SLIDES - 1) {
    currentSlide++;
    updateSlide(1);
  } else {
    recommend();
  }
}

function goBack() {
  if (currentSlide > 0) {
    currentSlide--;
    updateSlide(-1);
  }
}

function selectOption(btn) {
  const q = btn.closest(".question");
  const key = q.dataset.q;
  q.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
  btn.classList.add("selected");
  answers[key] = btn.dataset.v;
  updateNextButton();
}

document.querySelectorAll(".quiz-slide .options button").forEach((btn) => {
  btn.addEventListener("click", () => selectOption(btn));
});

async function loadStyles() {
  try {
    const data = await fetchJSON("/api/styles");
    const box = $("styles");
    box.innerHTML = "";
    data.styles.forEach((key) => {
      const s = STYLES[key] || STYLES.morning;
      const chip = document.createElement("button");
      chip.className = "style-chip" + (key === currentStyle ? " active" : "");
      chip.innerHTML = `<span class="num">${s.roman}</span>${s.name}`;
      chip.onclick = () => {
        currentStyle = key;
        box.querySelectorAll(".style-chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        generate();
      };
      box.appendChild(chip);
    });
    const status = $("status");
    status.textContent = data.status.mcp ? "已连接麦当劳 MCP（实时数据）" : "示例模式（无 MCP 实时数据）";
    status.classList.toggle("fallback", !data.status.mcp);
    if (data.styles.length) currentStyle = data.styles[0];
    renderEmptyCard();
  } catch (e) {
    $("status").textContent = "无法连接服务";
    $("status").classList.add("fallback");
  }
}

function closeQuiz() {
  $("quiz-overlay").classList.remove("show");
}

function openQuiz() {
  $("quiz-overlay").classList.add("show");
}

function showRecommendToast(name, reason) {
  const el = $("recommend-toast");
  el.innerHTML = `为你推荐 <strong>${name}</strong> · ${reason}`;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 6000);
}

async function recommend() {
  const nextBtn = $("btn-quiz-next");
  nextBtn.disabled = true;
  nextBtn.textContent = "推荐中…";
  try {
    const data = await fetchJSON("/api/recommend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(answers)
    });
    currentStyle = data.style;
    const s = STYLES[data.style];

    // 更新左侧推荐摘要
    $("rec-summary").innerHTML = `推荐抽取 <strong style="color:var(--gold)">${s.name}</strong>。<br>${data.reason}`;

    // 高亮风格按钮
    $("styles").querySelectorAll(".style-chip").forEach((c) => c.classList.remove("active"));
    const active = Array.from($("styles").children).find((c) => c.textContent.includes(s.name));
    if (active) active.classList.add("active");

    closeQuiz();
    showRecommendToast(s.name, data.reason);

    // 自动抽取
    setTimeout(() => generate(), 700);
  } catch (e) {
    toast("推荐失败：" + e.message);
    nextBtn.disabled = false;
    nextBtn.textContent = "获取推荐";
  }
}

async function generate() {
  const btn = $("btn-gen");
  btn.disabled = true;
  try {
    const data = await fetchJSON("/api/write", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ style: currentStyle })
    });
    currentCard = data;
    renderCard(data);
  } catch (e) {
    toast("生成失败：" + e.message);
  } finally {
    btn.disabled = false;
  }
}

function renderEmptyCard() {
  const s = STYLES[currentStyle] || STYLES.morning;
  $("c-roman").textContent = s.roman;
  $("c-title").textContent = s.name;
  $("c-subtitle").textContent = s.en;
  $("c-plaque-en").textContent = "THE MCMEN ORACLE";
  $("c-plaque-cn").textContent = s.plaque;
  $("c-image").src = s.image;
  $("c-text").textContent = "点击下方按钮，抽取今日麦门神谕…";
  $("c-source").textContent = "";
}

function renderCard(card) {
  const style = card.style || currentStyle;
  const s = STYLES[style] || STYLES.morning;
  currentStyle = style;
  $("c-roman").textContent = s.roman;
  $("c-title").textContent = s.name;
  $("c-subtitle").textContent = s.en;
  $("c-plaque-en").textContent = "THE MCMEN ORACLE";
  $("c-plaque-cn").textContent = s.plaque;
  $("c-image").src = s.image;
  $("c-text").textContent = normalizeDigits(card.text || "");
  const ctx = card.context || {};
  $("c-source").textContent = ctx.source === "mcp" ? "数据源：麦当劳 MCP 实时神谕" : "数据源：内置示例神谕";
  $("styles").querySelectorAll(".style-chip").forEach((c) => c.classList.remove("active"));
  const active = Array.from($("styles").children).find((c) => c.textContent.includes(s.name));
  if (active) active.classList.add("active");
}

function normalizeDigits(s) {
  return String(s).replace(/[0-9]/g, (d) => String.fromCharCode(0xFF10 + parseInt(d, 10)));
}

$("btn-quiz-next").addEventListener("click", goNext);
$("btn-quiz-back").addEventListener("click", goBack);
$("btn-gen").addEventListener("click", generate);
$("btn-skip-quiz").addEventListener("click", () => {
  closeQuiz();
  $("rec-summary").textContent = "已跳过问卷，可直接选择下方生活签或点击生成。";
});
$("btn-retake").addEventListener("click", () => {
  answers = {};
  currentSlide = 0;
  document.querySelectorAll(".quiz-slide .options button").forEach((b) => b.classList.remove("selected"));
  updateSlide();
  openQuiz();
});

$("btn-copy").addEventListener("click", () => {
  if (!currentCard) return toast("先生成一张牌");
  const text = $("c-text").textContent;
  navigator.clipboard.writeText(text).then(() => toast("文案已复制"));
});

$("btn-download").addEventListener("click", () => {
  if (!currentCard) return toast("先生成一张牌");
  drawCardToPNG(currentCard);
});

function wrapText(ctx, text, maxW) {
  const paragraphs = text.split("\n");
  const out = [];
  for (const para of paragraphs) {
    const words = para.split("");
    let line = "";
    for (const ch of words) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW && line) {
        out.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) out.push(line);
  }
  return out;
}

function drawCardToPNG(card) {
  const W = 720, H = 1260;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const style = card.style || currentStyle;
  const s = STYLES[style];

  const bg = ctx.createRadialGradient(W * 0.35, H * 0.28, 0, W / 2, H / 2, W * 0.95);
  bg.addColorStop(0, "#F9EFD6");
  bg.addColorStop(0.4, "#F5E9CC");
  bg.addColorStop(0.8, "#EAD5B0");
  bg.addColorStop(1, "#DEC89C");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(0,0,0,.02)";
  for (let i = 0; i < 40000; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);

  ctx.strokeStyle = "#C9A227";
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, W - 36, H - 36);
  ctx.strokeStyle = "#8A6E1E";
  ctx.lineWidth = 2;
  ctx.strokeRect(26, 26, W - 52, H - 52);
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = "rgba(138,110,30,.45)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(36, 36, W - 72, H - 72);
  ctx.setLineDash([]);

  const drawCorner = (x, y, rot) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot * Math.PI / 180);
    ctx.strokeStyle = "#7B1F3A";
    ctx.fillStyle = "#7B1F3A";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 42); ctx.lineTo(0, 10); ctx.lineTo(32, 10); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, 9, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  drawCorner(22, 22, 0);
  drawCorner(W - 22, 22, 90);
  drawCorner(W - 22, H - 22, 180);
  drawCorner(22, H - 22, 270);

  const cx = W / 2;
  ctx.textAlign = "center";

  ctx.fillStyle = "#7B1F3A";
  ctx.font = "38px 'Cinzel', 'Times New Roman', serif";
  ctx.fillText(s.roman, cx, 105);
  ctx.font = "bold 24px 'Noto Serif SC', 'Songti SC', serif";
  ctx.fillStyle = "#2A2132";
  ctx.fillText(s.name, cx, 145);
  ctx.font = "14px 'Cinzel', 'Times New Roman', serif";
  ctx.fillStyle = "#8A6E1E";
  ctx.fillText(s.en, cx, 172);

  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const srcSize = Math.min(iw, ih);
    const sx = (iw - srcSize) / 2;
    const sy = (ih - srcSize) / 2;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, 380, 150, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, sx, sy, srcSize, srcSize, cx - 150, 230, 300, 300);
    ctx.restore();

    ctx.strokeStyle = "#8A6E1E";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, 380, 150, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, 380, 134, 0, Math.PI * 2); ctx.stroke();

    finishPNG(ctx, card, W, H, cx, cv);
  };
  img.onerror = () => {
    ctx.strokeStyle = "#8A6E1E";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, 380, 150, 0, Math.PI * 2); ctx.stroke();
    finishPNG(ctx, card, W, H, cx, cv);
  };
  img.src = s.image;
}

function finishPNG(ctx, card, W, H, cx, cv) {
  ctx.fillStyle = "#2A2132";
  ctx.font = "28px 'Noto Serif SC', 'Songti SC', serif";
  const text = normalizeDigits(card.text || "");
  const lines = wrapText(ctx, text, W - 180);
  const lineH = 50;
  const startY = 610 + Math.max(0, (6 - lines.length) * lineH * 0.5);
  ctx.fillStyle = "#8A6E1E";
  ctx.font = "30px 'Cinzel', serif";
  ctx.fillText("“", 82, startY - 15);
  ctx.fillText("”", W - 82, startY + (lines.length - 1) * lineH + 15);
  ctx.fillStyle = "#2A2132";
  ctx.font = "28px 'Noto Serif SC', 'Songti SC', serif";
  lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lineH));

  ctx.strokeStyle = "#8A6E1E";
  ctx.lineWidth = 2;
  const py = H - 140;
  ctx.fillStyle = "rgba(201,162,39,.1)";
  ctx.beginPath(); ctx.roundRect(52, py, W - 104, 58, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#7B1F3A";
  ctx.font = "13px 'Cinzel', serif";
  ctx.fillText("THE MCMEN ORACLE", cx, py + 24);
  ctx.fillStyle = "#8A6E1E";
  ctx.font = "14px 'Noto Serif SC', serif";
  const s = STYLES[card.style || currentStyle];
  ctx.fillText(s.plaque.replace(/\s/g, "").split("").join(" "), cx, py + 46);

  const ctx2 = card.context || {};
  ctx.fillStyle = "#8A6E1E";
  ctx.font = "12px 'Noto Serif SC', serif";
  ctx.fillText(ctx2.source === "mcp" ? "数据源：麦当劳 MCP 实时神谕" : "数据源：内置示例神谕", cx, H - 52);

  const link = document.createElement("a");
  link.download = `麦门神谕_${s.name}_${Date.now()}.png`;
  link.href = cv.toDataURL("image/png");
  link.click();
  toast("图片已下载");
}

loadStyles();
</script>
