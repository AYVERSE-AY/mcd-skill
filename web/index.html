<script>
const STYLE_NAMES = { verse: "语录体", liturgy: "礼赞体", poem: "诗词体", rap: "说唱体", blessing: "祈福体" };
const STYLE_ROMAN = { verse: "I", liturgy: "II", poem: "III", rap: "IV", blessing: "V" };
const STYLE_TITLES = { verse: "THE GOLDEN ORACLE", liturgy: "THE CROWN FEAST", poem: "THE MOONLIT VERSE", rap: "THE RHYME CROWN", blessing: "THE GUARDIAN WISH" };
const STYLE_PLAQUE_CN = { verse: "黄 金 神 谕", liturgy: "盛 典 赞 歌", poem: "月 下 诗 篇", rap: "节 奏 王 冠", blessing: "守 护 祈 愿" };
let currentStyle = "verse";
let currentCard = null;

const SYMBOLS = {
  verse: `<circle cx="60" cy="60" r="48" stroke-dasharray="4 4" opacity=".6"/>
<path d="M60 18v12M60 90v12M18 60h12M90 60h12" opacity=".7"/>
<path d="M60 38a8 8 0 0 0-8-8h-16a8 8 0 0 0-8 8v28a8 8 0 0 0 8 8h24a8 8 0 0 0 8-8V38z" fill="rgba(201,162,39,.12)"/>
<ellipse cx="60" cy="58" rx="16" ry="10" fill="rgba(201,162,39,.2)"/>
<path d="M60 42v32M52 50h16M52 58h16M52 66h16" opacity=".8"/>
<path d="M48 78c0 8 5.4 14 12 14s12-6 12-14" fill="none"/>
<circle cx="44" cy="44" r="3" fill="currentColor" opacity=".6"/>
<circle cx="76" cy="44" r="3" fill="currentColor" opacity=".6"/>
<path d="M32 86c8-6 16-8 28-8s20 2 28 8" fill="none" opacity=".5"/>`,
  liturgy: `<circle cx="60" cy="60" r="48" stroke-dasharray="2 3" opacity=".5"/>
<path d="M60 20l6 12h12l-10 8 4 12-12-8-12 8 4-12-10-8h12z" fill="rgba(201,162,39,.18)"/>
<path d="M38 70c0-12 9.8-22 22-22s22 10 22 22v18H38V70z" fill="rgba(123,31,58,.08)"/>
<path d="M38 70c0-8 9.8-14 22-14s22 6 22 14" fill="none"/>
<path d="M45 88h30M48 80h24M52 72h16" opacity=".7"/>
<circle cx="60" cy="58" r="6" fill="currentColor" opacity=".5"/>
<path d="M24 60c10-4 20-6 36-6s26 2 36 6" fill="none" opacity=".4"/>`,
  poem: `<circle cx="60" cy="60" r="48" opacity=".5"/>
<circle cx="60" cy="45" r="14" fill="rgba(201,162,39,.12)"/>
<path d="M46 45a14 14 0 0 1 28 0" fill="none"/>
<circle cx="54" cy="42" r="2" fill="currentColor" opacity=".5"/>
<circle cx="66" cy="42" r="2" fill="currentColor" opacity=".5"/>
<path d="M60 100c-18-8-28-20-28-36 0-10 6-18 14-22M60 100c18-8 28-20 28-36 0-10-6-18-14-22" fill="none" opacity=".6"/>
<path d="M30 92c10 6 20 8 30 8s20-2 30-8" fill="none" opacity=".4"/>
<path d="M42 82c6 4 12 6 18 6s12-2 18-6" fill="none" opacity=".5"/>
<path d="M35 54c-4-2-6-6-6-10M85 54c4-2 6-6 6-10" fill="none" opacity=".5"/>`,
  rap: `<circle cx="60" cy="60" r="48" stroke-dasharray="3 5" opacity=".5"/>
<rect x="48" y="32" width="24" height="44" rx="4" fill="rgba(201,162,39,.1)"/>
<circle cx="60" cy="40" r="6" fill="rgba(201,162,39,.2)"/>
<path d="M52 48h16M52 56h16M52 64h12" opacity=".7"/>
<path d="M72 58l10-6v20l-10-6z" fill="rgba(123,31,58,.1)"/>
<path d="M28 70c8-4 18-6 32-6s24 2 32 6" fill="none" opacity=".5"/>
<path d="M24 78c10-4 22-6 36-6s26 2 36 6" fill="none" opacity=".4"/>
<circle cx="34" cy="50" r="2" fill="currentColor" opacity=".5"/>
<circle cx="86" cy="50" r="2" fill="currentColor" opacity=".5"/>`,
  blessing: `<circle cx="60" cy="60" r="48" opacity=".5"/>
<path d="M60 22c-14 0-24 10-24 24 0 14 24 40 24 40s24-26 24-40c0-14-10-24-24-24z" fill="rgba(201,162,39,.12)"/>
<path d="M60 30c-10 0-18 7-18 16 0 9 18 28 18 28s18-19 18-28c0-9-8-16-18-16z" fill="rgba(123,31,58,.06)"/>
<path d="M60 88v20M50 100h20" opacity=".6"/>
<path d="M36 60c6-4 12-6 24-6s18 2 24 6" fill="none" opacity=".5"/>
<path d="M30 72c8-4 18-6 30-6s22 2 30 6" fill="none" opacity=".4"/>
<circle cx="60" cy="52" r="4" fill="currentColor" opacity=".4"/>
<path d="M30 44c4-6 10-10 16-10M90 44c-4-6-10-10-16-10" fill="none" opacity=".5"/>`
};

const $ = (id) => document.getElementById(id);
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

async function fetchJSON(url, opts = {}, timeout = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function loadStyles() {
  try {
    const data = await fetchJSON("/api/styles");
    const box = $("styles");
    box.innerHTML = "";
    data.styles.forEach((key) => {
      const chip = document.createElement("button");
      chip.className = "style-chip" + (key === currentStyle ? " active" : "");
      chip.innerHTML = `<span class="num">${STYLE_ROMAN[key]}</span>${STYLE_NAMES[key] || key}`;
      chip.onclick = () => {
        currentStyle = key;
        box.querySelectorAll(".style-chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        generate();
      };
      box.appendChild(chip);
    });
  } catch (e) {
    $("status").textContent = "无法连接服务";
    $("status").classList.add("fallback");
  }
}

async function generate() {
  const btn = $("btn-gen");
  btn.disabled = true;
  try {
    const data = await fetchJSON("/api/write?style=" + currentStyle);
    currentCard = data;
    renderCard(data);
  } catch (e) {
    toast("生成失败：" + e.message);
  } finally {
    btn.disabled = false;
  }
}

function renderCard(card) {
  const style = card.style || currentStyle;
  $("c-roman").textContent = STYLE_ROMAN[style] || "I";
  $("c-title").textContent = STYLE_NAMES[style] || style;
  $("c-subtitle").textContent = STYLE_TITLES[style] || "THE ORACLE";
  $("c-plaque-en").textContent = STYLE_TITLES[style] || "THE ORACLE";
  $("c-plaque-cn").textContent = STYLE_PLAQUE_CN[style] || "麦 门 神 谕";
  $("c-symbol").innerHTML = SYMBOLS[style] || SYMBOLS.verse;
  $("c-text").textContent = normalizeDigits(card.text || "");
  const ctx = card.context || {};
  const src = ctx.source === "mcp" ? "麦当劳 MCP 实时神谕" : "内置示例神谕";
  $("c-source").textContent = "数据源：" + src;
  const status = $("status");
  status.textContent = ctx.source === "mcp" ? "已连接麦当劳 MCP（实时数据）" : "示例模式（无 MCP 实时数据）";
  status.classList.toggle("fallback", ctx.source !== "mcp");
}

function normalizeDigits(s) {
  return String(s).replace(/[0-9]/g, (d) => String.fromCharCode(0xFF10 + parseInt(d, 10)));
}

function wrapText(ctx, text, maxW) {
  const paragraphs = text.split("\n");
  const out = [];
  for (const para of paragraphs) {
    const words = para.split("");
    let line = "";
    for (const ch of words) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW && line) {
        out.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) out.push(line);
  }
  return out;
}

function drawSymbolPath(ctx, style, cx, cy, size) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(size / 120, size / 120);
  ctx.strokeStyle = "#8A6E1E";
  ctx.fillStyle = "rgba(201,162,39,.12)";
  ctx.lineWidth = 1.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  if (style === "verse") {
    ctx.beginPath(); ctx.arc(60, 60, 48, 0, Math.PI * 2); ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(60, 18); ctx.lineTo(60, 30); ctx.moveTo(60, 90); ctx.lineTo(60, 102);
    ctx.moveTo(18, 60); ctx.lineTo(30, 60); ctx.moveTo(90, 60); ctx.lineTo(102, 60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, 38); ctx.bezierCurveTo(52, 30, 44, 30, 36, 38); ctx.lineTo(36, 66); ctx.bezierCurveTo(36, 74, 44, 74, 60, 74); ctx.bezierCurveTo(76, 74, 84, 74, 84, 66); ctx.lineTo(84, 38); ctx.bezierCurveTo(76, 30, 68, 30, 60, 38); ctx.fill();
    ctx.beginPath(); ctx.ellipse(60, 58, 16, 10, 0, 0, Math.PI * 2); ctx.fillStyle = "rgba(201,162,39,.2)"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(60, 42); ctx.lineTo(60, 74); ctx.moveTo(52, 50); ctx.lineTo(68, 50); ctx.moveTo(52, 58); ctx.lineTo(68, 58); ctx.moveTo(52, 66); ctx.lineTo(68, 66); ctx.stroke();
    ctx.beginPath(); ctx.arc(44, 44, 3, 0, Math.PI * 2); ctx.arc(76, 44, 3, 0, Math.PI * 2); ctx.fillStyle = "#8A6E1E"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(32, 86); ctx.bezierCurveTo(40, 80, 48, 78, 60, 78); ctx.bezierCurveTo(72, 78, 80, 80, 88, 86); ctx.stroke();
  } else if (style === "liturgy") {
    ctx.beginPath(); ctx.arc(60, 60, 48, 0, Math.PI * 2); ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(60, 20); ctx.lineTo(66, 32); ctx.lineTo(78, 32); ctx.lineTo(68, 40); ctx.lineTo(72, 52); ctx.lineTo(60, 44); ctx.lineTo(48, 52); ctx.lineTo(52, 40); ctx.lineTo(42, 32); ctx.lineTo(54, 32); ctx.closePath(); ctx.fillStyle = "rgba(201,162,39,.18)"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(38, 70); ctx.bezierCurveTo(38, 54, 47.5, 48, 60, 48); ctx.bezierCurveTo(72.5, 48, 82, 54, 82, 70); ctx.lineTo(82, 88); ctx.lineTo(38, 88); ctx.closePath(); ctx.fillStyle = "rgba(123,31,58,.08)"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(38, 70); ctx.bezierCurveTo(38, 62, 47.5, 56, 60, 56); ctx.bezierCurveTo(72.5, 56, 82, 62, 82, 70); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(45, 88); ctx.lineTo(75, 88); ctx.moveTo(48, 80); ctx.lineTo(72, 80); ctx.moveTo(52, 72); ctx.lineTo(68, 72); ctx.stroke();
    ctx.beginPath(); ctx.arc(60, 58, 6, 0, Math.PI * 2); ctx.fillStyle = "#8A6E1E"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(24, 60); ctx.bezierCurveTo(34, 56, 44, 54, 60, 54); ctx.bezierCurveTo(76, 54, 86, 56, 96, 60); ctx.stroke();
  } else if (style === "poem") {
    ctx.beginPath(); ctx.arc(60, 60, 48, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(60, 45, 14, 0, Math.PI * 2); ctx.fillStyle = "rgba(201,162,39,.12)"; ctx.fill();
    ctx.beginPath(); ctx.arc(54, 42, 2, 0, Math.PI * 2); ctx.arc(66, 42, 2, 0, Math.PI * 2); ctx.fillStyle = "#8A6E1E"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(60, 100); ctx.bezierCurveTo(42, 92, 32, 80, 32, 64); ctx.bezierCurveTo(32, 54, 38, 46, 46, 42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, 100); ctx.bezierCurveTo(78, 92, 88, 80, 88, 64); ctx.bezierCurveTo(88, 54, 82, 46, 74, 42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, 92); ctx.bezierCurveTo(40, 98, 50, 100, 60, 100); ctx.bezierCurveTo(70, 100, 80, 98, 90, 92); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(42, 82); ctx.bezierCurveTo(48, 86, 54, 88, 60, 88); ctx.bezierCurveTo(66, 88, 72, 86, 78, 82); ctx.stroke();
  } else if (style === "rap") {
    ctx.beginPath(); ctx.arc(60, 60, 48, 0, Math.PI * 2); ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.roundRect(48, 32, 24, 44, 4); ctx.fillStyle = "rgba(201,162,39,.1)"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(60, 40, 6, 0, Math.PI * 2); ctx.fillStyle = "rgba(201,162,39,.2)"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(52, 48); ctx.lineTo(68, 48); ctx.moveTo(52, 56); ctx.lineTo(68, 56); ctx.moveTo(52, 64); ctx.lineTo(64, 64); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(72, 58); ctx.lineTo(82, 52); ctx.lineTo(82, 72); ctx.lineTo(72, 66); ctx.closePath(); ctx.fillStyle = "rgba(123,31,58,.1)"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(28, 70); ctx.bezierCurveTo(36, 66, 46, 64, 60, 64); ctx.bezierCurveTo(74, 64, 84, 66, 92, 70); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(24, 78); ctx.bezierCurveTo(34, 74, 46, 72, 60, 72); ctx.bezierCurveTo(74, 72, 86, 74, 96, 78); ctx.stroke();
    ctx.beginPath(); ctx.arc(34, 50, 2, 0, Math.PI * 2); ctx.arc(86, 50, 2, 0, Math.PI * 2); ctx.fillStyle = "#8A6E1E"; ctx.fill();
  } else if (style === "blessing") {
    ctx.beginPath(); ctx.arc(60, 60, 48, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, 22); ctx.bezierCurveTo(46, 22, 36, 32, 36, 46); ctx.bezierCurveTo(36, 60, 60, 86, 60, 86); ctx.bezierCurveTo(60, 86, 84, 60, 84, 46); ctx.bezierCurveTo(84, 32, 74, 22, 60, 22); ctx.closePath(); ctx.fillStyle = "rgba(201,162,39,.12)"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, 30); ctx.bezierCurveTo(50, 30, 42, 37, 42, 46); ctx.bezierCurveTo(42, 55, 60, 74, 60, 74); ctx.bezierCurveTo(60, 74, 78, 55, 78, 46); ctx.bezierCurveTo(78, 37, 70, 30, 60, 30); ctx.closePath(); ctx.fillStyle = "rgba(123,31,58,.06)"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(60, 88); ctx.lineTo(60, 108); ctx.moveTo(50, 100); ctx.lineTo(70, 100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(36, 60); ctx.bezierCurveTo(42, 56, 48, 54, 60, 54); ctx.bezierCurveTo(72, 54, 78, 56, 84, 60); ctx.stroke();
    ctx.beginPath(); ctx.arc(60, 52, 4, 0, Math.PI * 2); ctx.fillStyle = "#8A6E1E"; ctx.fill();
  }
  ctx.restore();
}

function drawCard(card) {
  const W = 720, H = 1260;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const style = card.style || "verse";

  // parchment
  const bg = ctx.createRadialGradient(W * 0.35, H * 0.28, 0, W / 2, H / 2, W * 0.95);
  bg.addColorStop(0, "#F9EFD6");
  bg.addColorStop(0.4, "#F5E9CC");
  bg.addColorStop(0.8, "#EAD5B0");
  bg.addColorStop(1, "#DEC89C");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // fine grain
  ctx.fillStyle = "rgba(0,0,0,.02)";
  for (let i = 0; i < 40000; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);

  // outer border
  ctx.strokeStyle = "#C9A227";
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, W - 36, H - 36);
  ctx.strokeStyle = "#8A6E1E";
  ctx.lineWidth = 2;
  ctx.strokeRect(26, 26, W - 52, H - 52);
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = "rgba(138,110,30,.45)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(36, 36, W - 72, H - 72);
  ctx.setLineDash([]);

  // corners
  const drawCorner = (x, y, rot) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot * Math.PI / 180);
    ctx.strokeStyle = "#7B1F3A";
    ctx.fillStyle = "#7B1F3A";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 42); ctx.lineTo(0, 10); ctx.lineTo(32, 10); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(8, 36); ctx.lineTo(8, 16); ctx.lineTo(26, 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 22); ctx.quadraticCurveTo(12, 16, 18, 8); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, 9, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  drawCorner(22, 22, 0);
  drawCorner(W - 22, 22, 90);
  drawCorner(W - 22, H - 22, 180);
  drawCorner(22, H - 22, 270);

  const cx = W / 2;
  ctx.textAlign = "center";

  // top numbering area
  ctx.fillStyle = "#7B1F3A";
  ctx.font = "38px 'Cinzel', 'Times New Roman', serif";
  ctx.fillText(STYLE_ROMAN[style] || "I", cx, 105);
  ctx.font = "bold 22px 'Noto Serif SC', 'Songti SC', serif";
  ctx.fillText(STYLE_NAMES[style] || style, cx, 145);
  ctx.font = "14px 'Cinzel', 'Times New Roman', serif";
  ctx.fillStyle = "#8A6E1E";
  ctx.fillText(STYLE_TITLES[style] || "THE ORACLE", cx, 172);

  // central symbol frame
  ctx.strokeStyle = "#8A6E1E";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, 380, 150, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, 380, 134, 0, Math.PI * 2); ctx.stroke();
  const symGrad = ctx.createRadialGradient(cx, 380, 0, cx, 380, 150);
  symGrad.addColorStop(0, "rgba(201,162,39,.08)");
  symGrad.addColorStop(1, "transparent");
  ctx.fillStyle = symGrad;
  ctx.beginPath(); ctx.arc(cx, 380, 150, 0, Math.PI * 2); ctx.fill();
  drawSymbolPath(ctx, style, cx, 380, 200);

  // main text with quote marks
  ctx.fillStyle = "#2A2132";
  ctx.font = "28px 'Noto Serif SC', 'Songti SC', serif";
  const text = normalizeDigits(card.text || "");
  const lines = wrapText(ctx, text, W - 180);
  const lineH = 50;
  const startY = 610 + Math.max(0, (6 - lines.length) * lineH * 0.5);
  ctx.fillStyle = "#8A6E1E";
  ctx.font = "30px 'Cinzel', serif";
  ctx.fillText("“", 82, startY - 15);
  ctx.fillText("”", W - 82, startY + (lines.length - 1) * lineH + 15);
  ctx.fillStyle = "#2A2132";
  ctx.font = "28px 'Noto Serif SC', 'Songti SC', serif";
  lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lineH));

  // bottom plaque
  const ctxInfo = card.context || {};
  const src = ctxInfo.source === "mcp" ? "麦当劳 MCP 实时神谕" : "内置示例神谕";
  ctx.strokeStyle = "#8A6E1E";
  ctx.lineWidth = 1;
  const pw = 360, ph = 64, px = cx - pw / 2, py = H - 220;
  ctx.fillStyle = "rgba(201,162,39,.06)";
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeRect(px, py, pw, ph);
  ctx.beginPath(); ctx.moveTo(px, py + ph / 2); ctx.lineTo(px + pw, py + ph / 2); ctx.stroke();
  ctx.fillStyle = "#7B1F3A";
  ctx.font = "20px 'Cinzel', 'Times New Roman', serif";
  ctx.fillText(STYLE_TITLES[style] || "THE ORACLE", cx, py + 28);
  ctx.fillStyle = "#8A6E1E";
  ctx.font = "16px 'Noto Serif SC', 'Songti SC', serif";
  ctx.fillText(STYLE_PLAQUE_CN[style] || "麦 门 神 谕", cx, py + 52);

  ctx.fillStyle = "#8A7F68";
  ctx.font = "15px 'Noto Serif SC', 'Songti SC', serif";
  ctx.fillText("数据源：" + src, cx, H - 120);
  ctx.font = "13px 'Noto Serif SC', serif";
  ctx.fillText("圣餐：" + (ctxInfo.dish || "—") + "  ｜  启示：" + (ctxInfo.activity || "—"), cx, H - 92);

  // vignette
  const g = ctx.createRadialGradient(cx, H / 2, W * 0.4, cx, H / 2, W * 0.85);
  g.addColorStop(0, "rgba(60,42,28,0)");
  g.addColorStop(1, "rgba(60,42,28,.18)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  return cv.toDataURL("image/png");
}

$("btn-gen").onclick = generate;
$("btn-copy").onclick = () => {
  if (!currentCard) return toast("请先抽牌");
  navigator.clipboard.writeText(normalizeDigits(currentCard.text || "")).then(() => toast("箴言已复制"));
};
$("btn-dl").onclick = () => {
  if (!currentCard) return toast("请先抽牌");
  const a = document.createElement("a");
  a.href = drawCard(currentCard);
  a.download = `mcmen-oracle-${currentCard.style}-${Date.now()}.png`;
  a.click();
};

async function init() {
  await loadStyles();
  generate();
}
init();
</script>
