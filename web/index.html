<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麦门神谕 · McMen Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0b0d18;
  --bg-panel: rgba(20, 22, 38, 0.72);
  --gold: #e6b94a;
  --gold-light: #ffdf80;
  --gold-dark: #8a6e1e;
  --wine: #9b1b3a;
  --wine-dark: #5c0f22;
  --parchment: #f9efd6;
  --ink: #2a2132;
  --cream: #fff8e7;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  color: var(--parchment);
  font-family: "Noto Serif SC", "Songti SC", serif;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
  transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

/* 背景星空 */
.stars {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(123, 31, 58, 0.18) 0%, transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(201, 162, 39, 0.1) 0%, transparent 45%),
    linear-gradient(180deg, #0b0d18 0%, #14162b 50%, #0b0d18 100%);
  z-index: -2;
}
.stars::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.8), transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.7), transparent),
    radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 230px 80px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 350px 50px, rgba(255,255,255,0.7), transparent),
    radial-gradient(2px 2px at 420px 180px, rgba(255,255,255,0.5), transparent);
  background-size: 450px 220px;
  opacity: 0.6;
}

.bg-image {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  z-index: -1;
}

.bg-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(11,13,24,0.2) 0%, rgba(11,13,24,0.1) 40%, rgba(11,13,24,0.75) 85%, rgba(11,13,24,0.95) 100%);
}

/* 通用按钮 */
.btn-primary {
  width: 100%;
  padding: 16px 24px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #c41e3a 0%, #8a1529 100%);
  color: var(--cream);
  font-family: "Noto Serif SC", serif;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(196, 30, 58, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: transform 0.15s, box-shadow 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(196, 30, 58, 0.5); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.btn-gold {
  padding: 12px 24px;
  border: 1px solid var(--gold);
  border-radius: 24px;
  background: rgba(201, 162, 39, 0.12);
  color: var(--gold-light);
  font-family: "Noto Serif SC", serif;
  font-size: 0.92rem;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-gold:hover { background: rgba(201, 162, 39, 0.22); }

/* 顶部 LOGO */
.top-logo {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 10;
}
.m-logo {
  width: 46px;
  height: 38px;
  position: relative;
}
.m-logo::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
  clip-path: path("M6 36 L6 12 C6 6 10 2 16 2 C22 2 23 8 23 14 L23 36 L19 36 L19 14 C19 10 18 6 16 6 C13 6 12 9 12 12 L12 36 Z M27 36 L27 14 C27 8 28 2 34 2 C40 2 44 6 44 12 L44 36 L40 36 L40 12 C40 9 39 6 36 6 C34 6 33 10 33 14 L33 36 Z");
  filter: drop-shadow(0 0 8px rgba(230,185,74,0.6));
}
.top-logo span {
  margin-top: 4px;
  font-size: 0.65rem;
  letter-spacing: 3px;
  color: var(--gold);
  opacity: 0.9;
}

/* 首页 */
#screen-landing .bg-image { background-image: url("assets/design/landing.png"); }
.landing-content {
  margin-top: auto;
  padding: 0 28px 48px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}
.landing-title {
  text-align: center;
  margin-bottom: 8px;
}
.landing-title h1 {
  font-family: "Cinzel", serif;
  font-size: 2.4rem;
  margin: 0;
  letter-spacing: 6px;
  color: var(--gold-light);
  text-shadow: 0 2px 16px rgba(230,185,74,0.4);
}
.landing-title p {
  margin: 8px 0 0;
  font-size: 0.95rem;
  opacity: 0.85;
  letter-spacing: 1px;
}
.input-box {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 30px;
  background: rgba(255, 248, 231, 0.95);
  border: 1px solid rgba(201, 162, 39, 0.4);
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}
.input-box .mic {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c41e3a, #8a1529);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cream);
  font-size: 0.9rem;
  flex-shrink: 0;
}
.input-box input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-family: "Noto Serif SC", serif;
  font-size: 0.95rem;
  color: var(--ink);
}
.input-box input::placeholder { color: #8a6e1e; opacity: 0.7; }
.input-box .wave {
  display: flex;
  gap: 2px;
  align-items: flex-end;
  height: 16px;
}
.input-box .wave i {
  width: 3px;
  background: var(--gold-dark);
  border-radius: 2px;
  animation: wave 1s ease-in-out infinite;
}
.input-box .wave i:nth-child(1) { height: 6px; animation-delay: 0s; }
.input-box .wave i:nth-child(2) { height: 12px; animation-delay: 0.15s; }
.input-box .wave i:nth-child(3) { height: 8px; animation-delay: 0.3s; }
.input-box .wave i:nth-child(4) { height: 14px; animation-delay: 0.1s; }
@keyframes wave {
  0%, 100% { transform: scaleY(0.6); }
  50% { transform: scaleY(1); }
}
.landing-hint {
  font-size: 0.75rem;
  opacity: 0.6;
  letter-spacing: 1px;
  text-align: center;
}

/* 状态选择 */
#screen-states {
  padding: 90px 24px 32px;
  gap: 20px;
}
.states-header {
  text-align: center;
}
.states-header h2 {
  font-size: 1.45rem;
  margin: 0 0 6px;
  letter-spacing: 2px;
  color: var(--gold-light);
}
.states-header p {
  margin: 0;
  font-size: 0.8rem;
  opacity: 0.65;
}
.states-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 8px;
}
.state-card {
  position: relative;
  aspect-ratio: 1 / 1.12;
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid rgba(201, 162, 39, 0.25);
  background: var(--bg-panel);
  backdrop-filter: blur(8px);
  transition: transform 0.2s, box-shadow 0.2s;
}
.state-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.state-card:active { transform: translateY(0) scale(0.98); }
.state-card .card-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0.85;
  transition: opacity 0.3s;
}
.state-card:hover .card-bg { opacity: 1; }
.state-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(11,13,24,0.85) 100%);
}
.state-card .card-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 14px 10px;
  text-align: center;
  z-index: 2;
}
.state-card .card-label strong {
  display: block;
  font-size: 1rem;
  color: var(--gold-light);
  margin-bottom: 3px;
}
.state-card .card-label span {
  font-size: 0.65rem;
  opacity: 0.75;
  letter-spacing: 1px;
}
.state-card .corner-icon {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(201, 162, 39, 0.2);
  border: 1px solid rgba(201, 162, 39, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  z-index: 2;
}

.states-footer {
  margin-top: auto;
  display: flex;
  justify-content: center;
  padding-bottom: 8px;
}

/* AI 分析中 */
#screen-analyzing .bg-image { background-image: url("assets/design/analyzing.png"); }
.analyzing-content {
  margin-top: auto;
  padding: 0 32px 64px;
  width: 100%;
}
.analyzing-title {
  text-align: center;
  margin-bottom: 32px;
}
.analyzing-title h2 {
  font-family: "Cinzel", serif;
  font-size: 1.8rem;
  margin: 0 0 8px;
  color: var(--gold-light);
  letter-spacing: 3px;
}
.analyzing-title p {
  margin: 0;
  font-size: 0.8rem;
  opacity: 0.65;
}
.analyzing-steps {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.step {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  border-radius: 14px;
  background: rgba(20, 22, 38, 0.55);
  border: 1px solid rgba(201, 162, 39, 0.15);
  opacity: 0.45;
  transition: opacity 0.4s, border-color 0.4s, transform 0.4s;
}
.step.active {
  opacity: 1;
  border-color: rgba(201, 162, 39, 0.5);
  background: rgba(20, 22, 38, 0.75);
  transform: translateX(8px);
}
.step.done { opacity: 0.85; }
.step-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(201, 162, 39, 0.15);
  border: 1px solid rgba(201, 162, 39, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.step.active .step-icon {
  background: rgba(201, 162, 39, 0.3);
  box-shadow: 0 0 14px rgba(230,185,74,0.35);
}
.step-text h4 {
  margin: 0 0 3px;
  font-size: 0.95rem;
  color: var(--cream);
}
.step-text p {
  margin: 0;
  font-size: 0.75rem;
  opacity: 0.7;
}
.analyzing-glow {
  position: absolute;
  bottom: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(230,185,74,0.25) 0%, transparent 70%);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  pointer-events: none;
  z-index: -1;
}
@keyframes pulse {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
  50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
}

/* 结果页 */
#screen-result {
  padding: 80px 20px 24px;
  overflow-y: auto;
}
#screen-result::-webkit-scrollbar { width: 0; }
.result-header {
  text-align: center;
  margin-bottom: 18px;
}
.result-header h2 {
  font-family: "Cinzel", serif;
  font-size: 1.3rem;
  margin: 0 0 4px;
  color: var(--gold-light);
  letter-spacing: 2px;
}
.result-header p {
  margin: 0;
  font-size: 0.75rem;
  opacity: 0.65;
}

.oracle-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
  border-radius: 24px;
  padding: 22px;
  background: linear-gradient(180deg, #1a0f12 0%, #2a1218 100%);
  border: 2px solid var(--gold);
  box-shadow:
    0 0 0 1px rgba(230,185,74,0.3),
    0 0 40px rgba(196, 30, 58, 0.25),
    0 20px 60px rgba(0,0,0,0.5);
  overflow: hidden;
}
.oracle-card::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(230,185,74,0.35);
  border-radius: 20px;
  pointer-events: none;
}
.oracle-card .card-shine {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(230,185,74,0.1) 0%, transparent 50%, rgba(196,30,58,0.08) 100%);
  pointer-events: none;
}
.card-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.card-m {
  width: 42px;
  height: 34px;
  margin-bottom: 10px;
  position: relative;
}
.card-m::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
  clip-path: path("M5 32 L5 10 C5 5 9 2 14 2 C19 2 20 7 20 12 L20 32 L17 32 L17 12 C17 8 16 5 14 5 C11 5 10 8 10 10 L10 32 Z M24 32 L24 12 C24 7 25 2 30 2 C35 2 39 5 39 10 L39 32 L36 32 L36 10 C36 8 35 5 32 5 C30 5 29 8 29 12 L29 32 Z");
  filter: drop-shadow(0 0 6px rgba(230,185,74,0.5));
}
.card-image-wrap {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  padding: 6px;
  background: rgba(0,0,0,0.2);
  box-shadow: 0 0 30px rgba(230,185,74,0.2);
  margin-bottom: 16px;
}
.card-image-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.card-title-banner {
  width: 100%;
  padding: 10px 16px;
  text-align: center;
  background: linear-gradient(90deg, transparent 0%, rgba(196,30,58,0.25) 20%, rgba(196,30,58,0.35) 50%, rgba(196,30,58,0.25) 80%, transparent 100%);
  border-top: 1px solid rgba(230,185,74,0.3);
  border-bottom: 1px solid rgba(230,185,74,0.3);
  margin-bottom: 14px;
}
.card-title-banner h3 {
  margin: 0;
  font-size: 1.35rem;
  color: var(--gold-light);
  letter-spacing: 2px;
}
.card-title-banner span {
  font-size: 0.7rem;
  color: var(--gold);
  opacity: 0.85;
}
.card-poem {
  text-align: center;
  font-size: 0.95rem;
  line-height: 1.85;
  color: var(--cream);
  margin-bottom: 16px;
  padding: 0 6px;
}
.card-dish {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-radius: 30px;
  background: rgba(255,248,231,0.1);
  border: 1px solid rgba(230,185,74,0.3);
  margin-bottom: 16px;
}
.card-dish .dish-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
}
.card-dish .dish-info { flex: 1; }
.card-dish .dish-info strong {
  display: block;
  font-size: 0.95rem;
  color: var(--gold-light);
}
.card-dish .dish-info span {
  font-size: 0.7rem;
  opacity: 0.7;
}
.card-dish .arrow {
  color: var(--gold);
  font-size: 1.1rem;
}
.nutrition-pills {
  display: flex;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-bottom: 6px;
}
.nutrition-pills .pill {
  flex: 1;
  text-align: center;
  padding: 10px 6px;
  border-radius: 12px;
  background: rgba(255,248,231,0.92);
  color: var(--ink);
}
.nutrition-pills .pill span {
  display: block;
  font-size: 0.65rem;
  color: #8a6e1e;
  margin-bottom: 2px;
}
.nutrition-pills .pill strong {
  font-size: 0.95rem;
  color: var(--wine);
}

.result-actions {
  display: flex;
  gap: 12px;
  margin-top: 22px;
  justify-content: center;
}
.result-actions .btn-gold {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.result-footer {
  margin-top: 18px;
  text-align: center;
}
.result-footer button {
  background: transparent;
  border: none;
  color: var(--gold);
  font-family: "Noto Serif SC", serif;
  font-size: 0.8rem;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.result-footer button:hover { opacity: 1; }

/* Toast */
#toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.85);
  color: var(--cream);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 0.85rem;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 1000;
  border: 1px solid rgba(201,162,39,0.3);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 加载层 */
#global-loader {
  position: fixed;
  inset: 0;
  background: rgba(11,13,24,0.85);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
#global-loader.show { opacity: 1; pointer-events: auto; }
.loader-spinner {
  width: 44px;
  height: 44px;
  border: 3px solid rgba(201,162,39,0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (min-width: 480px) {
  #app {
    max-width: 430px;
    margin: 0 auto;
    border-left: 1px solid rgba(201,162,39,0.1);
    border-right: 1px solid rgba(201,162,39,0.1);
  }
}
</style>
</head>
<body>

<div id="app">
  <div class="stars"></div>

  <!-- 首页 -->
  <section class="screen active" id="screen-landing">
    <div class="bg-image"></div>
    <div class="top-logo"><div class="m-logo"></div><span>McMEN ORACLE</span></div>
    <div class="landing-content">
      <div class="landing-title">
        <h1>麦门神谕</h1>
        <p>让 AI 读懂你的今天，再决定你的一餐</p>
      </div>
      <div class="input-box">
        <div class="mic">🎙</div>
        <input type="text" id="landing-input" placeholder="试着说说你现在的状态…" autocomplete="off">
        <div class="wave"><i></i><i></i><i></i><i></i></div>
      </div>
      <button class="btn-primary" id="btn-start">开始抽取我的麦门神谕 →</button>
      <div class="landing-hint">每一种状态，都会得到专属的麦当劳神谕推荐</div>
    </div>
  </section>

  <!-- 状态选择 -->
  <section class="screen" id="screen-states">
    <div class="top-logo"><div class="m-logo"></div><span>McMEN ORACLE</span></div>
    <div class="states-header">
      <h2>今天的你，属于哪一种状态？</h2>
      <p>六大生活签 · 快速选择或自由输入</p>
    </div>
    <div class="states-grid" id="states-grid"></div>
    <div class="states-footer">
      <button class="btn-gold" id="btn-custom-state">✎ 自由输入状态</button>
    </div>
  </section>

  <!-- AI 分析中 -->
  <section class="screen" id="screen-analyzing">
    <div class="bg-image"></div>
    <div class="top-logo"><div class="m-logo"></div><span>McMEN ORACLE</span></div>
    <div class="analyzing-glow"></div>
    <div class="analyzing-content">
      <div class="analyzing-title">
        <h2>AI 分析中</h2>
        <p>动态加载 · 展示思考过程</p>
      </div>
      <div class="analyzing-steps" id="analyzing-steps"></div>
    </div>
  </section>

  <!-- 结果页 -->
  <section class="screen" id="screen-result">
    <div class="top-logo"><div class="m-logo"></div><span>McMEN ORACLE</span></div>
    <div class="result-header">
      <h2>你的今日神谕已生成</h2>
      <p>麦门神谕，为你点亮今日时刻</p>
    </div>
    <div class="oracle-card" id="oracle-card">
      <div class="card-shine"></div>
      <div class="card-inner">
        <div class="card-m"></div>
        <div class="card-image-wrap"><img id="result-image" src="" alt="神谕卡面"></div>
        <div class="card-title-banner">
          <h3 id="result-title">--</h3>
          <span id="result-subtitle">祈福体</span>
        </div>
        <div class="card-poem" id="result-poem">点击下方按钮，抽取今日麦门神谕…</div>
        <div class="card-dish">
          <div class="dish-icon" id="dish-icon">🍔</div>
          <div class="dish-info">
            <strong id="result-dish">--</strong>
            <span id="result-activity">--</span>
          </div>
          <div class="arrow">›</div>
        </div>
        <div class="nutrition-pills" id="nutrition-pills"></div>
      </div>
    </div>
    <div class="result-actions">
      <button class="btn-gold" id="btn-download">⬇ 下载神谕卡</button>
      <button class="btn-gold" id="btn-share">↗ 分享给好友</button>
    </div>
    <div class="result-footer">
      <button id="btn-restart">继续探索更多神谕 ↓</button>
    </div>
  </section>
</div>

<div id="toast"></div>
<div id="global-loader"><div class="loader-spinner"></div></div>

<script>
const STYLES = {
  morning:   { name: "早八续命签", en: "THE MORNING AWAKENING", plaque: "晨 起 神 谕", roman: "I",  image: "assets/cards/card-1.png" },
  lunch:     { name: "中午干饭签", en: "THE LUNCH DECREE",      plaque: "干 饭 神 谕", roman: "II", image: "assets/cards/card-2.png" },
  afternoon: { name: "下午茶摸鱼签", en: "THE AFTERNOON SNEAK", plaque: "摸 鱼 神 谕", roman: "III",image: "assets/cards/card-3.png" },
  overtime:  { name: "加班回血签", en: "THE NIGHT SHIFT CURE",  plaque: "回 血 神 谕", roman: "IV", image: "assets/cards/card-4.png" },
  feast:     { name: "周末欢聚签", en: "THE WEEKEND FEAST",     plaque: "欢 聚 神 谕", roman: "V",  image: "assets/cards/card-5.png" },
  light:     { name: "自律轻食签", en: "THE LIGHT CHOICE",      plaque: "轻 食 神 谕", roman: "VI", image: "assets/cards/card-6.png" }
};

const STATES = [
  { key: "study",     label: "学习备考", sub: "积累知识·照亮未来",   icon: "📚", bg: "assets/design/states.png", answers: { time: "morning", mood: "disciplined", scene: "home", health: "no" } },
  { key: "overtime",  label: "加班工作", sub: "专注投入·持续向前",   icon: "💼", bg: "assets/design/states.png", answers: { time: "night", mood: "stressed", scene: "office", health: "no" } },
  { key: "relax",     label: "放松休闲", sub: "享受当下·充电再出发", icon: "☕", bg: "assets/design/states.png", answers: { time: "afternoon", mood: "relaxed", scene: "home", health: "no" } },
  { key: "social",    label: "社交聚会", sub: "相聚时刻·快乐加倍",   icon: "🥂", bg: "assets/design/states.png", answers: { time: "evening", mood: "happy", scene: "party", health: "no" } },
  { key: "low",       label: "情绪低落", sub: "允许低落·也会放晴",   icon: "🌧", bg: "assets/design/states.png", answers: { time: "evening", mood: "stressed", scene: "home", health: "no" } },
  { key: "reward",    label: "奖励自己", sub: "辛苦了·值得更好",     icon: "🎁", bg: "assets/design/states.png", answers: { time: "noon", mood: "happy", scene: "home", health: "no" } }
];

const STEPS = [
  { icon: "🕐", title: "识别时间场景",    get: (a) => a.time ? `${timeText(a.time)} · ${periodText(a.time)}` : "正在感知时间…" },
  { icon: "💗", title: "分析情绪状态",    get: (a) => a.mood ? `${moodText(a.mood)} · ${moodDesc(a.mood)}` : "读取你的心情…" },
  { icon: "🌟", title: "理解核心需求",    get: (a) => a.scene ? `${sceneText(a.scene)} · ${needText(a)}` : "理解你的需求…" },
  { icon: "🃏", title: "匹配塔罗风格",    get: (a) => "祈福体 · 治愈鼓励" },
  { icon: "🍔", title: "准备调用麦当劳 MCP 数据", get: (a) => "活动 · 商品 · 营养" }
];

function timeText(k) {
  const map = { morning: "早上", noon: "中午", afternoon: "下午", evening: "晚上", night: "深夜" };
  return map[k] || k;
}
function periodText(k) {
  const map = { morning: "7-11点", noon: "11-14点", afternoon: "14-17点", evening: "17-21点", night: "21点后" };
  return map[k] || "";
}
function moodText(k) {
  const map = { tired: "困倦", confused: "纠结", stressed: "压力大", relaxed: "放松", happy: "开心", disciplined: "自律", lazy: "想摸鱼" };
  return map[k] || k;
}
function moodDesc(k) {
  const map = { tired: "需要续命", confused: "选择困难", stressed: "需要回血", relaxed: "享受当下", happy: "值得分享", disciplined: "健康优先", lazy: "摸鱼一下" };
  return map[k] || "";
}
function sceneText(k) {
  const map = { commute: "通勤", office: "办公室", home: "家里", party: "聚会", gym: "健身", outdoor: "户外" };
  return map[k] || k;
}
function needText(a) {
  if (a.health === "yes") return "自律轻食";
  if (a.mood === "tired") return "早八续命";
  if (a.mood === "stressed") return "加班回血";
  if (a.mood === "happy") return "欢聚分享";
  if (a.mood === "relaxed" || a.mood === "lazy") return "下午茶摸鱼";
  return "命中注定";
}

let currentAnswers = {};
let currentStyle = "morning";
let currentCard = null;

const $ = (id) => document.getElementById(id);
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
function showLoader(show) { $("global-loader").classList.toggle("show", show); }

function switchScreen(name) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  $(`screen-${name}`).classList.add("active");
}

async function fetchJSON(url, opts = {}, timeout = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function renderStates() {
  const grid = $("states-grid");
  grid.innerHTML = "";
  STATES.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "state-card";
    card.innerHTML = `
      <div class="card-bg" style="background-image:url('${s.bg}');background-position:${(i % 2) * 100}% ${Math.floor(i / 2) * 50}%"></div>
      <div class="corner-icon">${s.icon}</div>
      <div class="card-label"><strong>${s.label}</strong><span>${s.sub}</span></div>
    `;
    card.addEventListener("click", () => startAnalyze(s.answers, s.label));
    grid.appendChild(card);
  });
}

async function startAnalyze(answers, stateLabel) {
  currentAnswers = answers;
  switchScreen("analyzing");
  renderAnalyzingSteps(0);

  const freeText = ($("landing-input").value || "").trim();
  if (freeText) currentAnswers.freeText = freeText;

  // 逐步动画
  for (let i = 0; i < STEPS.length; i++) {
    await wait(750);
    renderAnalyzingSteps(i + 1);
  }

  try {
    const rec = await fetchJSON("/api/recommend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(currentAnswers)
    });
    currentStyle = rec.style;
    const card = await fetchJSON("/api/write", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ style: rec.style })
    });
    currentCard = card;
    renderResult(card, stateLabel);
    switchScreen("result");
  } catch (e) {
    toast("神谕生成失败：" + e.message);
    switchScreen("states");
  }
}

function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

function renderAnalyzingSteps(activeIdx) {
  const box = $("analyzing-steps");
  box.innerHTML = "";
  STEPS.forEach((step, i) => {
    const el = document.createElement("div");
    el.className = "step" + (i === activeIdx ? " active" : i < activeIdx ? " done" : "");
    el.innerHTML = `
      <div class="step-icon">${i < activeIdx ? "✓" : step.icon}</div>
      <div class="step-text"><h4>${step.title}</h4><p>${step.get(currentAnswers)}</p></div>
    `;
    box.appendChild(el);
  });
}

function renderResult(card, stateLabel) {
  const style = card.style || currentStyle;
  const s = STYLES[style] || STYLES.morning;
  $("result-image").src = s.image;
  $("result-title").textContent = s.name;
  $("result-subtitle").textContent = stateLabel ? `为「${stateLabel}」祈福` : "祈福体";
  $("result-poem").textContent = normalizeDigits(card.text || "");

  const ctx = card.context || {};
  $("result-dish").textContent = ctx.dish || "麦门神秘单品";
  $("result-activity").textContent = ctx.activity ? `来自活动「${ctx.activity}」` : "麦当劳 MCP 实时推荐";

  // 营养胶囊
  const pills = $("nutrition-pills");
  pills.innerHTML = "";
  const nutrition = [
    { label: "热量", value: ctx.calories ? `${ctx.calories} kcal` : "--" },
    { label: "蛋白质", value: ctx.protein ? `${ctx.protein} g` : "--" },
    { label: "碳水化合物", value: ctx.carbohydrate ? `${ctx.carbohydrate} g` : "--" }
  ];
  nutrition.forEach((p) => {
    const div = document.createElement("div");
    div.className = "pill";
    div.innerHTML = `<span>${p.label}</span><strong>${p.value}</strong>`;
    pills.appendChild(div);
  });

  // 图标根据风格微调
  const dishIcon = { morning: "☕", lunch: "🍔", afternoon: "🍟", overtime: "🍔", feast: "🥤", light: "🥗" };
  $("dish-icon").textContent = dishIcon[style] || "🍔";
}

function normalizeDigits(s) {
  return String(s).replace(/[0-9]/g, (d) => String.fromCharCode(0xFF10 + parseInt(d, 10)));
}

function wrapText(ctx, text, maxW) {
  const paragraphs = text.split("\n");
  const out = [];
  for (const para of paragraphs) {
    const chars = para.split("");
    let line = "";
    for (const ch of chars) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW && line) {
        out.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) out.push(line);
  }
  return out;
}

function drawCardToPNG() {
  if (!currentCard) return toast("先生成一张神谕卡");
  const card = currentCard;
  const W = 720, H = 1280;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const style = card.style || currentStyle;
  const s = STYLES[style];

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#1a0f12");
  bg.addColorStop(1, "#2a1218");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 外边框
  ctx.strokeStyle = "#e6b94a";
  ctx.lineWidth = 6;
  ctx.strokeRect(24, 24, W - 48, H - 48);
  ctx.strokeStyle = "rgba(230,185,74,0.35)";
  ctx.lineWidth = 2;
  ctx.strokeRect(34, 34, W - 68, H - 68);

  const cx = W / 2;

  // M logo
  ctx.fillStyle = "#ffdf80";
  ctx.font = "bold 42px 'Times New Roman', serif";
  ctx.textAlign = "center";
  ctx.fillText("M", cx, 95);

  // 图片
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const srcSize = Math.min(iw, ih);
    const sx = (iw - srcSize) / 2;
    const sy = (ih - srcSize) / 2;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, 340, 150, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, sx, sy, srcSize, srcSize, cx - 150, 190, 300, 300);
    ctx.restore();

    ctx.strokeStyle = "#e6b94a";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, 340, 150, 0, Math.PI * 2); ctx.stroke();

    finishPNG(ctx, card, W, H, cx, cv);
  };
  img.onerror = () => finishPNG(ctx, card, W, H, cx, cv);
  img.src = s.image;
}

function finishPNG(ctx, card, W, H, cx, cv) {
  const s = STYLES[card.style || currentStyle];

  // 标题横幅
  const bannerY = 560;
  ctx.fillStyle = "rgba(196,30,58,0.25)";
  ctx.fillRect(60, bannerY, W - 120, 80);
  ctx.strokeStyle = "rgba(230,185,74,0.3)";
  ctx.lineWidth = 1;
  ctx.strokeRect(60, bannerY, W - 120, 80);
  ctx.fillStyle = "#ffdf80";
  ctx.font = "bold 38px 'Noto Serif SC', serif";
  ctx.textAlign = "center";
  ctx.fillText(s.name, cx, bannerY + 45);
  ctx.fillStyle = "#e6b94a";
  ctx.font = "20px 'Noto Serif SC', serif";
  ctx.fillText("祈福体", cx, bannerY + 70);

  // 诗句
  const text = normalizeDigits(card.text || "");
  ctx.font = "28px 'Noto Serif SC', serif";
  ctx.fillStyle = "#fff8e7";
  const lines = wrapText(ctx, text, W - 140);
  const lineH = 48;
  const startY = 690 + Math.max(0, (6 - lines.length) * lineH * 0.5);
  lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lineH));

  // 推荐单品
  const ctx2 = card.context || {};
  const dishY = startY + lines.length * lineH + 50;
  ctx.fillStyle = "rgba(255,248,231,0.1)";
  ctx.strokeStyle = "rgba(230,185,74,0.3)";
  ctx.beginPath(); ctx.roundRect(90, dishY, W - 180, 70, 35); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#ffdf80";
  ctx.font = "28px 'Noto Serif SC', serif";
  ctx.fillText(ctx2.dish || "麦门神秘单品", cx, dishY + 42);

  // 营养
  const pillY = dishY + 100;
  const pillW = (W - 160) / 3;
  const nutritions = [
    { label: "热量", value: ctx2.calories ? `${ctx2.calories} kcal` : "--" },
    { label: "蛋白质", value: ctx2.protein ? `${ctx2.protein} g` : "--" },
    { label: "碳水", value: ctx2.carbohydrate ? `${ctx2.carbohydrate} g` : "--" }
  ];
  nutritions.forEach((p, i) => {
    const x = 80 + i * (pillW + 10);
    ctx.fillStyle = "#fff8e7";
    ctx.beginPath(); ctx.roundRect(x, pillY, pillW, 90, 12); ctx.fill();
    ctx.fillStyle = "#8a6e1e";
    ctx.font = "18px 'Noto Serif SC', serif";
    ctx.fillText(p.label, x + pillW / 2, pillY + 32);
    ctx.fillStyle = "#9b1b3a";
    ctx.font = "bold 24px 'Noto Serif SC', serif";
    ctx.fillText(p.value, x + pillW / 2, pillY + 66);
  });

  // 数据源
  ctx.fillStyle = "rgba(255,248,231,0.6)";
  ctx.font = "16px 'Noto Serif SC', serif";
  ctx.fillText(ctx2.source === "mcp" ? "数据源：麦当劳 MCP 实时神谕" : "数据源：内置示例神谕", cx, H - 50);

  const link = document.createElement("a");
  link.download = `麦门神谕_${s.name}_${Date.now()}.png`;
  link.href = cv.toDataURL("image/png");
  link.click();
  toast("神谕卡已下载");
}

// 事件绑定
$("btn-start").addEventListener("click", () => {
  switchScreen("states");
});

$("btn-custom-state").addEventListener("click", () => {
  const txt = ($("landing-input").value || "").trim();
  if (!txt) {
    toast("先在首页输入你的状态吧");
    switchScreen("landing");
    return;
  }
  // 简单关键词匹配
  const map = {
    "学习": STATES[0].answers, "考": STATES[0].answers,
    "加班": STATES[1].answers, "工作": STATES[1].answers, "累": STATES[1].answers,
    "放松": STATES[2].answers, "休息": STATES[2].answers, "休闲": STATES[2].answers,
    "聚会": STATES[3].answers, "朋友": STATES[3].answers, "社交": STATES[3].answers,
    "低落": STATES[4].answers, "难过": STATES[4].answers, "emo": STATES[4].answers,
    "奖励": STATES[5].answers, "庆祝": STATES[5].answers, "开心": STATES[5].answers
  };
  let answers = STATES[5].answers;
  for (const [k, v] of Object.entries(map)) {
    if (txt.includes(k)) { answers = v; break; }
  }
  startAnalyze(answers, "自由输入");
});

$("btn-download").addEventListener("click", drawCardToPNG);
$("btn-share").addEventListener("click", () => {
  if (!currentCard) return toast("先生成一张神谕卡");
  const text = $("result-poem").textContent + " —— " + $("result-dish").textContent;
  navigator.clipboard.writeText(text).then(() => toast("文案已复制，快去分享吧"));
});
$("btn-restart").addEventListener("click", () => {
  $("landing-input").value = "";
  switchScreen("landing");
});

// 初始化
renderStates();
</script>
